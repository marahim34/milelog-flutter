name: milelog_flutter
description: Cross-platform mileage tracker — Flutter conversion of MileLog Android app.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Database ──────────────────────────────────────────────────────────────
  drift: ^2.20.0
  drift_flutter: ^0.2.2          # bundles sqlite3_flutter_libs

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── Maps ──────────────────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0   # proximity-clusters stop markers on long routes
  latlong2: ^0.9.1               # coordinate type used by flutter_map

  # ── Location & permissions ────────────────────────────────────────────────
  geolocator: ^13.0.0
  permission_handler: ^11.3.1
  geocoding: ^3.0.0      # reverse geocoding for Bluetooth-stop waypoint addresses

  # ── Background GPS service ────────────────────────────────────────────────
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2

  # ── Export ────────────────────────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.1
  csv: ^6.0.0
  share_plus: ^10.1.2

  # ── Utilities ─────────────────────────────────────────────────────────────
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
