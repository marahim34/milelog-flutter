<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MileLog — Dashboard & Settings</title>
  <link rel="stylesheet" href="styles.css?v=3"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>
  <div class="intro">
    <h1>MileLog — Dashboard &amp; Settings</h1>
    <p>Dark-mode-first Material 3 mileage tracker. Space Grotesk with tabular numerics; JetBrains Mono for micro-labels. Accent is a calibrated trust-blue. Two screens, fully interactive — tap bottom nav to swap, tap settings rows to open sheets.</p>
  </div>

  <div class="stage" id="stage"></div>

  <!-- Tweaks panel -->
  <div id="tweaks" class="tweaks">
    <div class="row">
      <h4>Theme</h4>
      <div class="seg" id="themeSeg">
        <button data-v="dark" class="sel">Dark</button>
        <button data-v="light">Light</button>
      </div>
    </div>
    <div class="row">
      <h4>Palette</h4>
      <div class="seg" id="paletteSeg">
        <button data-v="magenta" class="sel">Rose</button>
        <button data-v="lime">Lime</button>
        <button data-v="cyan">Cyan</button>
      </div>
    </div>
    <div class="row">
      <h4>Language</h4>
      <div class="seg" id="langSeg">
        <button data-v="en" class="sel">EN</button>
        <button data-v="fi">FI</button>
      </div>
    </div>
  </div>

  <script>
    /*EDITMODE-BEGIN*/const TWEAKS = {"theme":"dark","palette":"magenta","language":"en"}/*EDITMODE-END*/;
    window.__TWEAKS = TWEAKS;
  </script>

  <script type="text/babel" src="frames/android-frame.jsx"></script>
  <script type="text/babel" src="components/icons.jsx"></script>
  <script type="text/babel" src="components/ui.jsx"></script>
  <script type="text/babel" src="components/navbar.jsx"></script>
  <script type="text/babel" src="components/flows.jsx"></script>
  <script type="text/babel" src="components/dashboard.jsx"></script>
  <script type="text/babel" src="components/settings.jsx"></script>
  <script type="text/babel" src="components/reports.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
